name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - uses: erlef/setup-beam@v1
        if: runner.os != 'Windows'
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install Elixir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install elixir --yes --no-progress

      - name: Install dependencies
        run: npm install

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build better-sqlite3 native addon (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GYP_MSVS_VERSION: '2022'
        run: |
          # better-sqlite3 is an optionalDependency: when its install fails,
          # npm silently drops the package (no node_modules/better-sqlite3 at
          # all). v12.11.1 ships no node-v115 (node 20) prebuilds, so install
          # it directly -- never optional -- and build from source if needed.
          if [ ! -d node_modules/better-sqlite3 ]; then
            npm install better-sqlite3 --no-save --foreground-scripts
          fi
          cd node_modules/better-sqlite3
          npx --yes prebuild-install || npx --yes node-gyp rebuild --release
          ls -l build/Release/better_sqlite3.node

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run bundle

      - name: Run all tests
        run: npm test

      - name: Doctor (verify server starts)
        run: npx tsx src/cli.ts doctor
        continue-on-error: true
